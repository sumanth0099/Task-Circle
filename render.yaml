services:
  # Unified Web Service (Frontend + Backend)
  - type: web
    name: taskcircle
    env: docker
    rootDir: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskcircle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskcircle-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://taskcircle.onrender.com # Change this if you use a custom domain
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://taskcircle.onrender.com/api/auth/google/callback
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: taskcircle-db
    plan: free
    databaseName: taskcircle
    user: taskcircle_user

  - type: redis
    name: taskcircle-redis
    plan: free
