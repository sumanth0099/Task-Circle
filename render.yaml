services:
  # Backend Web Service
  - type: web
    name: taskcircle-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskcircle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskcircle-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://taskcircle-frontend.onrender.com # Will update if you customize the frontend name
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://taskcircle-backend.onrender.com/api/auth/google/callback
      - key: GROQ_API_KEY
        sync: false

  # Frontend Web Service
  - type: web
    name: taskcircle-frontend
    env: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://taskcircle-backend.onrender.com # Must match the backend name above

databases:
  - name: taskcircle-db
    plan: free
    databaseName: taskcircle
    user: taskcircle_user

# Redis is not officially supported natively in render.yaml blueprints without a paid plan or specific add-on for some regions. 
# We're creating it as a private service using the official Redis Docker image.
  - type: redis
    name: taskcircle-redis
    plan: free
